# Deploy stack for OnCoopera.
#
# Expects the three repos checked out as siblings on the host:
#   OnCoopera-BackEnd/     (this repo — API in ./backend)
#   OnCoopera-Backoffice/  (admin web panel, built as a static SPA behind nginx)
#   OnCoopera-Mobile/      (Expo app — shipped via EAS/store builds, not containerized here)

services:

  postgres:
    image: postgis/postgis:18-3.6
    container_name: oncoopera-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - oncoopera-network

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5


  minio:
    image: minio/minio
    container_name: oncoopera-minio
    restart: unless-stopped

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

    volumes:
      - minio_data:/data

    networks:
      - oncoopera-network

    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5


  api:
    build:
      context: ./backend

    container_name: oncoopera-api
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

    environment:
      NODE_ENV: production
      PORT: 3000

      DATABASE_URL: ${DATABASE_URL}

      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      AUTH_TOKEN_HASH_SECRET: ${AUTH_TOKEN_HASH_SECRET}
      BCRYPT_SALT_ROUNDS: ${BCRYPT_SALT_ROUNDS:-12}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-7}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}

      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
      EMAIL_HOST: ${EMAIL_HOST}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_SECURE: ${EMAIL_SECURE:-false}
      EMAIL_USERNAME: ${EMAIL_USERNAME}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-OnCoopera}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-no-reply@oncoopera.com.br}

      PASSWORD_RECOVERY_CODE_TTL_MINUTES: ${PASSWORD_RECOVERY_CODE_TTL_MINUTES:-10}
      PASSWORD_RECOVERY_RESET_TOKEN_TTL_MINUTES: ${PASSWORD_RECOVERY_RESET_TOKEN_TTL_MINUTES:-15}
      PASSWORD_RECOVERY_MAX_ATTEMPTS: ${PASSWORD_RECOVERY_MAX_ATTEMPTS:-5}
      PASSWORD_RECOVERY_RESEND_INTERVAL_SECONDS: ${PASSWORD_RECOVERY_RESEND_INTERVAL_SECONDS:-60}
      PASSWORD_RECOVERY_RATE_LIMIT_WINDOW_MINUTES: ${PASSWORD_RECOVERY_RATE_LIMIT_WINDOW_MINUTES:-15}
      PASSWORD_RECOVERY_RATE_LIMIT_MAX_REQUESTS: ${PASSWORD_RECOVERY_RATE_LIMIT_MAX_REQUESTS:-5}
      TEMPORARY_PASSWORD_TTL_HOURS: ${TEMPORARY_PASSWORD_TTL_HOURS:-24}

      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-oncoopera-images}
      MINIO_URL_EXPIRATION_SECONDS: ${MINIO_URL_EXPIRATION_SECONDS:-900}
      IMAGE_MAX_SIZE_BYTES: ${IMAGE_MAX_SIZE_BYTES:-5242880}

    ports:
      - "127.0.0.1:3000:3000"

    networks:
      - oncoopera-network

    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/api').then(()=>process.exit(0)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s


  web:
    build:
      context: ../OnCoopera-Backoffice
      args:
        VITE_API_BASE_URL: /api

    container_name: oncoopera-web
    restart: unless-stopped

    depends_on:
      - api

    ports:
      - "127.0.0.1:8080:80"

    networks:
      - oncoopera-network


volumes:

  postgres_data:
    name: oncoopera-postgres-data

  minio_data:
    name: oncoopera-minio-data


networks:

  oncoopera-network:
    name: oncoopera-network